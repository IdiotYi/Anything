name: Verify Azure OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify Azure access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        run: |
          az account show \
            --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

      - name: Verify resource group access
        run: |
          az group show \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name, location:location, state:properties.provisioningState}" \
            --output table

      - name: Verify Azure Container Registry access
        run: |
          az acr show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name, loginServer:loginServer, sku:sku.name}" \
            --output table

      - name: Verify Azure Container App access
        if: ${{ vars.AZURE_CONTAINER_APP != '' }}
        run: |
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query "{name:name, status:properties.runningStatus, fqdn:properties.configuration.ingress.fqdn}" \
            --output table
