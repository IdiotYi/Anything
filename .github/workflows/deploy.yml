name: Deploy to Azure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: anything
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.endpoint.outputs.url }}

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify manually dispatched revision
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --requirement requirements.txt
          python -m compileall -q backend tests
          python -m unittest discover -s tests -v

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          az extension show --name containerapp --query version --output tsv

      - name: Validate deployment configuration
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP repository variable}"
          : "${ACR_NAME:?Set the AZURE_ACR_NAME repository variable}"
          : "${CONTAINER_APP:?Set the AZURE_CONTAINER_APP repository variable}"
          az group show --name "$RESOURCE_GROUP" --output none
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --output none
          az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --output none
          az containerapp revision set-mode \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --mode single \
            --output none
          az containerapp ingress enable \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --type external \
            --target-port 8000 \
            --transport auto \
            --allow-insecure false \
            --output none

      - name: Build and push immutable image in ACR
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          az acr build \
            --resource-group "$RESOURCE_GROUP" \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${DEPLOY_SHA}" \
            --file Dockerfile \
            .

      - name: Deploy a new Container Apps revision
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer --output tsv)
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${DEPLOY_SHA}" \
            --revision-suffix "r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --set-env-vars "DEPLOY_SHA=${DEPLOY_SHA}" \
            --min-replicas 0 \
            --max-replicas 1 \
            --output none

          DEPLOYED_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName --output tsv)
          test -n "$DEPLOYED_REVISION"

          for attempt in {1..30}; do
            READY_REVISION=$(az containerapp show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName --output tsv)
            if [ "$READY_REVISION" = "$DEPLOYED_REVISION" ]; then
              echo "Revision ${DEPLOYED_REVISION} is ready."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Revision ${DEPLOYED_REVISION} did not become ready." >&2
              az containerapp revision show \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$DEPLOYED_REVISION" \
                --output json
              exit 1
            fi
            sleep 10
          done
          echo "DEPLOYED_REVISION=$DEPLOYED_REVISION" >> "$GITHUB_ENV"

      - name: Resolve production endpoint
        id: endpoint
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$FQDN"
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer --output tsv)
          EXPECTED_IMAGE="${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${DEPLOY_SHA}"
          DEPLOYED_IMAGE=$(az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$DEPLOYED_REVISION" \
            --query properties.template.containers[0].image --output tsv)
          REVISION_ACTIVE=$(az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$DEPLOYED_REVISION" \
            --query properties.active --output tsv)
          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"
          test "$REVISION_ACTIVE" = "true"

          for attempt in {1..18}; do
            HEALTH=$(curl --fail --silent --show-error --max-time 10 "${URL}/healthz" || true)
            VERSION=$(curl --fail --silent --show-error --max-time 10 "${URL}/versionz" || true)
            if grep -q '"status":"ok"' <<<"$HEALTH" && grep -q "${DEPLOY_SHA}" <<<"$VERSION"; then
              echo "Deployment ${DEPLOY_SHA} is healthy at ${URL}"
              exit 0
            fi
            echo "Health check attempt ${attempt}/18 failed; retrying in 10 seconds..."
            sleep 10
          done
          echo "Deployment did not become healthy. The previous Container Apps revision remains available for rollback." >&2
          exit 1
