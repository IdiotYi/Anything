name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Reject development-only API URLs
        run: |
          set -euo pipefail
          if matches=$(grep -R --line-number --fixed-strings "http://127.0.0.1:5000/api" frontend); then
            printf '%s\n' "$matches"
            echo "Frontend must use the same-origin /api endpoint." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Failed to scan frontend sources." >&2
              exit "$status"
            fi
          fi

      - name: Build production image
        run: docker build --tag anything:ci .
