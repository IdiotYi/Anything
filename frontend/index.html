<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Anything — 私享电影典藏</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="#top"><span class="brand-mark">A</span><span>ANYTHING</span></a><span class="top-meta">Private Cinema Collection · 2026</span></nav>
    <section class="hero" id="top">
      <p class="eyebrow">Curated cinema archive</p>
      <h1>探索银幕里的<br><em>无限世界</em></h1>
      <p class="hero-copy">从经典到新作，以更优雅的方式发现电影。输入片名，即刻开启你的私人放映清单。</p>
      <form class="search-form" id="searchForm" role="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" maxlength="80" autocomplete="off" placeholder="搜索电影、剧集或纪录片…" aria-label="电影名称">
        <button id="searchBtn" type="submit">开始探索</button>
      </form>
      <div class="suggestions"><span>热门灵感</span><button class="suggestion" data-query="阿凡达" type="button">阿凡达</button><button class="suggestion" data-query="繁花" type="button">繁花</button><button class="suggestion" data-query="流浪地球" type="button">流浪地球</button><button class="suggestion" data-query="新闻女王" type="button">新闻女王</button></div>
    </section>
    <section class="results" id="results" aria-live="polite">
      <header class="results-head"><div><p class="section-kicker">SEARCH COLLECTION</p><h2 class="results-title" id="resultsTitle">为你甄选</h2></div><span class="results-count" id="resultsCount"></span></header>
      <div class="note" id="resultsNote" hidden></div>
      <div class="grid" id="resultsGrid"></div>
      <nav class="pagination" id="pagination" aria-label="搜索结果分页"></nav>
    </section>
    <footer class="footer"><span>Anything · Cinema discovery</span><span>第三方结果仅供检索参考</span></footer>
  </main>
  <script src="assets/app.js" defer></script>
</body>
</html>
